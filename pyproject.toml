[project]
name = "company-brain"
version = "0.1.0"
description = "Permission-aware incident copilot over Slack, GitHub and Notion — Cognee × Scalekit × Respan"
requires-python = ">=3.10,<3.15"
dependencies = [
    "cognee>=1.6.3",
    "scalekit-sdk-python",
    "python-dotenv",
    "openai",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/brain"]
